[package]
name = "code-orchestrate"
version = "0.1.0"
description = "Code Orchestrate: launch and track coding Agent Sessions per Workspace"
authors = ["Miri Spence"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "code_orchestrate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
thiserror = "2.0.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
